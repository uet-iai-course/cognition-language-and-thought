<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img"
  aria-labelledby="title desc">
  <title id="title">Sáu ngành góp phần hình thành khoa học nhận thức</title>
  <desc id="desc">Sơ đồ mạng lưới gồm triết học, tâm lý học, ngôn ngữ học, khoa học máy tính, nhân chủng học và khoa học thần kinh. Mười một đường nối biểu thị các hướng nghiên cứu liên ngành đã tồn tại vào năm 1978.</desc>

  <style>
    .link {
      fill: none;
      stroke: #9aabb4;
      stroke-width: 3;
      stroke-linecap: round;
    }

    .node {
      fill: #eef8fa;
      stroke: #2a7291;
      stroke-width: 3;
    }

    .label {
      fill: #173f52;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 27px;
      font-weight: 700;
      text-anchor: middle;
    }

    .label-long {
      font-size: 24px;
    }

    .icon-bg {
      fill: #dceff3;
    }

    .icon-line {
      fill: none;
      stroke: #2a7291;
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-fill {
      fill: #2a7291;
    }

    .icon-symbol {
      fill: #2a7291;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 41px;
      font-weight: 700;
      text-anchor: middle;
    }

    .icon-code {
      fill: #2a7291;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      font-weight: 700;
      text-anchor: middle;
    }
  </style>

  <!-- Các đường nối được giữ nguyên theo sơ đồ của Quỹ Sloan năm 1978. -->
  <g aria-hidden="true">
    <path class="link" d="M500 46 L160 154" />
    <path class="link" d="M500 46 L840 154" />
    <path class="link" d="M160 154 L840 154" />
    <path class="link" d="M160 154 L160 366" />
    <path class="link" d="M840 154 L840 366" />
    <path class="link" d="M160 366 L500 474" />
    <path class="link" d="M840 366 L500 474" />
    <path class="link" d="M160 154 L840 366" />
    <path class="link" d="M160 366 L840 154" />
    <path class="link" d="M160 154 L500 474" />
    <path class="link" d="M840 154 L500 474" />
  </g>

  <g>
    <rect class="node" x="370" y="10" width="260" height="72" rx="16" />
    <g aria-hidden="true">
      <circle class="icon-bg" cx="405" cy="46" r="24" />
      <text class="icon-symbol" x="405" y="61">Φ</text>
    </g>
    <text class="label" x="520" y="55">Triết học</text>
  </g>

  <g>
    <rect class="node" x="20" y="118" width="280" height="72" rx="16" />
    <g aria-hidden="true">
      <circle class="icon-bg" cx="57" cy="154" r="24" />
      <text class="icon-symbol" x="57" y="169">Ψ</text>
    </g>
    <text class="label" x="180" y="163">Tâm lý học</text>
  </g>

  <g>
    <rect class="node" x="700" y="118" width="280" height="72" rx="16" />
    <g aria-hidden="true">
      <circle class="icon-bg" cx="737" cy="154" r="24" />
      <path class="icon-line" d="M737 136 L727 148 M737 136 L747 148 M727 148 L721 164 M727 148 L733 164 M747 148 L741 164 M747 148 L753 164" />
      <circle class="icon-fill" cx="737" cy="136" r="2.4" />
      <circle class="icon-fill" cx="727" cy="148" r="2.4" />
      <circle class="icon-fill" cx="747" cy="148" r="2.4" />
      <circle class="icon-fill" cx="721" cy="164" r="2.4" />
      <circle class="icon-fill" cx="733" cy="164" r="2.4" />
      <circle class="icon-fill" cx="741" cy="164" r="2.4" />
      <circle class="icon-fill" cx="753" cy="164" r="2.4" />
    </g>
    <text class="label label-long" x="850" y="162">Ngôn ngữ học</text>
  </g>

  <g>
    <rect class="node" x="20" y="330" width="280" height="72" rx="16" />
    <g aria-hidden="true">
      <circle class="icon-bg" cx="57" cy="366" r="24" />
      <rect class="icon-line" x="42" y="350" width="30" height="23" rx="3" />
      <path class="icon-line" d="M42 357 H72 M52 379 H62 M57 373 V379" />
      <text class="icon-code" x="57" y="369">&lt;/&gt;</text>
    </g>
    <text class="label" x="180" y="357">
      <tspan x="180" dy="0">Khoa học</tspan>
      <tspan x="180" dy="30">máy tính</tspan>
    </text>
  </g>

  <g>
    <rect class="node" x="700" y="330" width="280" height="72" rx="16" />
    <g aria-hidden="true">
      <circle class="icon-bg" cx="737" cy="366" r="24" />
      <circle class="icon-line" cx="729" cy="355" r="4" />
      <circle class="icon-line" cx="745" cy="355" r="4" />
      <path class="icon-line" d="M729 359 V373 M729 364 L722 369 M729 364 L736 369 M729 373 L724 382 M729 373 L734 382 M745 359 V373 M745 364 L739 369 M745 364 L752 369 M745 373 L740 382 M745 373 L750 382" />
    </g>
    <text class="label label-long" x="850" y="375">Nhân chủng học</text>
  </g>

  <g>
    <rect class="node" x="360" y="438" width="280" height="72" rx="16" />
    <g aria-hidden="true">
      <circle class="icon-bg" cx="397" cy="474" r="24" />
      <path class="icon-line" d="M397 458 C391 453 382 457 383 465 C376 469 380 479 387 480 C385 489 396 493 401 486 C407 493 417 489 416 481 C425 478 424 468 417 465 C418 456 406 453 397 458 Z" />
      <path class="icon-line" d="M397 458 V487 M388 464 C394 464 397 469 397 474 M407 463 C401 464 397 469 397 474 M387 480 C393 478 397 481 397 486 M416 481 C410 478 405 481 405 487" />
    </g>
    <text class="label" x="510" y="465">
      <tspan x="510" dy="0">Khoa học</tspan>
      <tspan x="510" dy="30">thần kinh</tspan>
    </text>
  </g>
</svg>
