<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
<title id="title">Các phân hệ của hệ thần kinh</title>
<desc id="desc">Trung ương gồm não và tủy sống. Ngoại biên chia thành cảm giác và vận động. Mỗi nhánh có phần tạng và bản thể. Vận động tạng chia thành giao cảm và phó giao cảm, theo sơ đồ gốc.</desc>
<style>text{font-family:Arial,sans-serif;fill:#242424;text-anchor:middle;font-size:21px} .head{font-weight:700;font-size:24px}.small{font-size:18px}.edge{fill:none;stroke-width:3;stroke-linejoin:round}.c{fill:#eee8f7;stroke:#8061b1}.p{fill:#e6f2f7;stroke:#287e98}.sub{fill:#fff1d8;stroke:#dfa84a}.auto{fill:#eaf1de;stroke:#94ad60}rect{stroke-width:2;rx:12}</style>
<!-- Branches indicate classification, not direction of neural transmission. -->
