<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 425" role="img" aria-labelledby="title desc">
<title id="title">Các vùng có nhịp phát triển khác nhau</title><desc id="desc">Ba đường định tính cho thấy kết nối hình thành và được cắt tỉa theo những nhịp khác nhau. Đây không phải số liệu đo.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2A7291"/></marker></defs>
<style>text{font-family:"Source Sans Pro",Arial,sans-serif;font-size:30px;fill:#222}.bold{font-weight:700}.line{fill:none;stroke:#2A7291;stroke-width:3;marker-end:url(#arrow)}.thin{fill:none;stroke:#2A7291;stroke-width:2}.node{fill:#EEF7FA;stroke:#2A7291;stroke-width:2.5}.accent{fill:#FDF3E3;stroke:#E8890C;stroke-width:2.5}.small{font-size:25px}</style>

